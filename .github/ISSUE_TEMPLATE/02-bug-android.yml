name: 安卓 App 问题
description: 安卓 App、桌面小组件、上课提醒或流体云不正常
title: "[安卓] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issue 是公开的。**不要填写**密码、验证码、cookie、学号、姓名、邮箱，也不要贴完整的 `/mobile/...` 链接或 `nufekebiao://` 配对链接，截图前请先打码。
  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: 在“关于 → 版本”查看。旧版本请先升级，确认问题是否还在。
      placeholder: 例如 1.3.5
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号和系统
      placeholder: 例如 小米 14 / HyperOS 2 / Android 15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题出在哪里
      multiple: true
      options:
        - 今天小组件
        - 本周小组件
        - 上课提醒或通知
        - 流体云（ColorOS 16+）
        - 课表刷新或同步
        - 链接粘贴或设备绑定
        - 检查更新或安装
        - App 界面
        - 其他
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: 账号连接状态
      description: 在“我的 → 账号连接”查看。
      options:
        - 已连接
        - 离线
        - 需重新登录
        - 还没有连接
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: background
    attributes:
      label: 是否已允许 App 后台运行
      description: 国产系统默认会限制后台。刷新或提醒不准时，请先在电池设置里允许自启动和后台运行。
      options:
        - 已允许
        - 没有允许
        - 不确定
    validations:
      required: true
  - type: input
    id: widget-size
    attributes:
      label: 小组件尺寸
      description: 小组件问题请填写；与小组件无关可以留空。
      placeholder: 例如 4×3
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 把本周小组件拉到 4×3
        2. 等到下一节课开始
        3. 观察时间轴
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际和预期
      description: 分别说明现在是什么样、应该是什么样。可以附上打码后的截图。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断日志
      description: |
        在“我的 → 提交反馈”导出诊断文件后拖到这里。文件会自动隐藏小组件链接和邮箱，上传前仍请打开检查一遍。
  - type: checkboxes
    id: privacy
    attributes:
      label: 发布前确认
      options:
        - label: 内容、截图和日志中没有密码、cookie、学号、姓名、邮箱或完整链接
          required: true
