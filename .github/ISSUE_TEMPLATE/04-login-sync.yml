name: 登录或课表同步问题
description: 无法登录、频繁掉登录、课表没更新，或课程内容和教务系统不一致
title: "[登录/同步] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issue 是公开的。**不要填写**密码、短信或动态验证码、cookie、学号、姓名、邮箱，也不要上传登录页、教务页面的原始 HTML 或完整课表，截图前请先打码。
        本站只把验证码和二次认证转交给本人完成，不会识别或绕过。学校系统维护或账号本身的问题，请联系学校。
  - type: dropdown
    id: problem
    attributes:
      label: 遇到了什么问题
      options:
        - 无法登录
        - 频繁提示需要重新登录
        - 课表不自动更新或刷新失败
        - 课程内容和教务系统不一致
        - 调课没有同步
        - 其他
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 在哪里看到的
      multiple: true
      options:
        - 网站
        - 安卓 App 或小组件
        - iOS 小组件
        - 日历订阅
        - 邮件通知
    validations:
      required: true
  - type: dropdown
    id: school-status
    attributes:
      label: 学校官方系统是否正常
      description: 请直接登录学校统一身份认证或教务系统对比，这能帮助判断问题在本站还是学校。
      options:
        - 官方系统正常，只有本站有问题
        - 官方系统也有问题
        - 没有对比过
    validations:
      required: true
  - type: dropdown
    id: login-method
    attributes:
      label: 登录方式
      options:
        - 账号密码（没有保存密码）
        - 账号密码（保存了密码）
        - 扫码登录
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: challenge
    attributes:
      label: 卡在哪一步
      description: 课表内容或刷新问题可以选“没有卡在验证环节”。
      options:
        - 没有卡在验证环节
        - 图形验证码
        - 滑块拼图
        - 短信二次认证
        - 动态口令
        - 其他二次认证
        - 二维码扫描或确认
    validations:
      required: true
  - type: input
    id: occurred-at
    attributes:
      label: 发生时间
      description: 精确到分钟即可，用于对照服务器日志和学校状态。
      placeholder: 例如 2026-11-03 07:45
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: 页面上的提示原文
      description: 请原样复制页面提示，例如顶部提示条或刷新状态里的文字。
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 经过
      description: 说明你做了什么、这个问题从什么时候开始。
    validations:
      required: true
  - type: textarea
    id: timetable-diff
    attributes:
      label: 课表差异
      description: 只有课程内容不一致时填写，只写出错的那一门课，不要贴完整课表。
      placeholder: |
        学期：2026-2027-1
        周次和时间：第 8 周周三第 1-2 节
        本站显示：教室 A101
        教务系统显示：教室 A203
  - type: checkboxes
    id: privacy
    attributes:
      label: 发布前确认
      options:
        - label: 内容和截图中没有密码、验证码、cookie、学号、姓名、邮箱、完整链接或完整课表
          required: true
