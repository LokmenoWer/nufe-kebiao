name: 功能建议
description: 提出新功能，或改进现有体验
title: "[功能] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。为了保护学校系统和同学的账号，本项目**不会**加入识别或绕过验证码和二次认证的功能，新功能也要尽量少访问学校服务器。
  - type: dropdown
    id: platform
    attributes:
      label: 涉及哪些部分
      multiple: true
      options:
        - 网站
        - 安卓 App 或小组件
        - iOS 小组件
        - 日历订阅
        - 邮件通知
        - 后端或刷新策略
        - 部署和管理员页
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 说说你遇到的场景，以及现在哪里不方便。
      placeholder: 例如 我经常要去不同校区上课，现在看不出两节课之间要不要提前出发……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
      description: 可以描述交互，也可以附上草图或其他产品的截图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代办法
      description: 没有可以留空。
  - type: textarea
    id: impact
    attributes:
      label: 可能的影响
      description: 如果你了解实现，可以说明它对学校服务器的请求量、隐私或各端一致性的影响。
  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意参与实现
      options:
        - 愿意提交 PR
        - 可以帮忙测试
        - 暂时不参与
    validations:
      required: true
