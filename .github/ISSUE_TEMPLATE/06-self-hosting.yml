name: 自部署或本地运行问题
description: 部署服务、配置反向代理和邮件，或本地运行演示站、CLI 时遇到问题
title: "[部署] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Issue 是公开的。**不要贴** `.env`、`deploy/deploy.env` 的内容或 `data/` 里的文件，包括 `APP_SECRET_KEY`、`ADMIN_PASSWORD_HASH`、`MAIL_PASSWORD`、SSH 私钥和服务器地址。贴日志前请把学号、邮箱、IP 和链接里的 token 打码。
        `app.cli --dump` 导出的页面可能含有个人信息，不要直接上传。
  - type: dropdown
    id: method
    attributes:
      label: 运行方式
      options:
        - deploy/deploy.sh + systemd
        - 手动运行 uvicorn
        - 演示服务器 scripts/demo_server.py
        - 命令行 app.cli
        - 其他
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 代码版本
      description: 运行 `git rev-parse --short HEAD` 查看。
      placeholder: 例如 fa0e69e
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 要求 Python 3.10+。后台刷新在进程内，只能启动一个 worker。
      placeholder: 例如 Ubuntu 24.04 / Python 3.12 / uv 0.5
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: 反向代理
      description: 本地运行可以留空。
      placeholder: 例如 Apache，独立主机名；Nginx，挂在 /kebiao 子路径
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      description: 写出执行的命令和改过的配置项名称，不要写配置项的值。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际和预期
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 服务器可以用 `journalctl -u kebiao -n 100 --no-pager` 查看，并附上 `GET /healthz` 的结果。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 发布前确认
      options:
        - label: 内容和日志中没有密钥、密码、SSH 私钥、服务器地址或用户的个人信息
          required: true
