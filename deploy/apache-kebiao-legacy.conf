# 从 https://example.com/kebiao/ 迁到独立主机名后，旧站点 *:443 vhost 里 Include 的内容（替换原来的反代）。
# 页面一律 301 到新地址；已经发出去的日历订阅、小组件链接（/ics/、/widget/，token 即凭证）原地继续反代，
# 不用让每个人重新订阅。新生成的链接已经是新主机名。
ProxyPassMatch "^/kebiao/((?:ics|widget)/.+)$" "http://127.0.0.1:8010/$1" timeout=90
<LocationMatch "^/kebiao/(?:ics|widget)/">
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
</LocationMatch>
RedirectMatch 301 "^/kebiao(?!/(?:ics|widget)/)(/.*)?$" "https://kebiao.example.com$1"
