# 从 https://example.com/kebiao/ 迁到独立主机名后，旧站点 *:443 vhost 里 Include 的内容（替换原来的反代）。
# 页面一律 308 到新地址；已经发出去的日历订阅、小组件链接（/ics/、/widget/，token 即凭证）原地继续反代，
# 不用让每个人重新订阅。新生成的链接已经是新主机名。
ProxyPassMatch "^/kebiao/((?:ics|widget)/.+)$" "unix:/run/kebiao/kebiao.sock|http://localhost/$1" timeout=90 retry=0
<LocationMatch "^/kebiao/(?:ics|widget)/">
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"
</LocationMatch>
# 安全提示：这些路径里的 token 就是凭证，访问日志不能记。CustomLog 是叠加的，在这里再写一条并不能让宿主 vhost
# 原有的那条停止记录——必须把宿主 vhost 自己的 CustomLog 改成带条件的，例如：
#     CustomLog ${APACHE_LOG_DIR}/access.log combined env=!kebiao_token_path
SetEnvIf Request_URI "^/kebiao/(ics|widget|mobile)/" kebiao_token_path
RedirectMatch 308 "^/kebiao(?!/(?:ics|widget)/)(/.*)?$" "https://kebiao.example.com$1"
