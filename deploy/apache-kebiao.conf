# 南财课表：https://kebiao.example.com/ → 127.0.0.1:8010（独立主机名，cookie path 为 /）
# 放到 /etc/apache2/sites-available/kebiao.conf，证书先用 certbot certonly 签好，再 a2ensite kebiao。
# 主机名换成你的域名；PUBLIC_BASE_URL 设成 https://kebiao.example.com（无路径前缀）。
<VirtualHost *:80>
    ServerName kebiao.example.com
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName kebiao.example.com
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8010/ timeout=90
    ProxyPassReverse / http://127.0.0.1:8010/
    ErrorLog ${APACHE_LOG_DIR}/kebiao-error.log
    # 安全提示：/ics/<token>.ics 与 /widget/<token>.* 里的 token 就是凭证，访问日志不记这两个路径
    SetEnvIf Request_URI "^/(ics|widget)/" kebiao_token_path
    CustomLog ${APACHE_LOG_DIR}/kebiao-access.log combined env=!kebiao_token_path

    SSLCertificateFile /etc/letsencrypt/live/kebiao.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/kebiao.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
