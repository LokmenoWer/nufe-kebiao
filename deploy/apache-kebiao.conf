# 南财课表：https://example.com/kebiao/ → 127.0.0.1:8010
# 在站点的 *:443 VirtualHost 内用一行 Include /etc/apache2/kebiao-proxy.conf 引入。
RedirectMatch 301 ^/kebiao$ /kebiao/
<Location /kebiao/>
    ProxyPass http://127.0.0.1:8010/ timeout=90
    ProxyPassReverse http://127.0.0.1:8010/
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
</Location>
