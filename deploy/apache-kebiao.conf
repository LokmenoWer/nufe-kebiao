# 南财课表：https://kebiao.example.com/ → 127.0.0.1:8010（独立主机名，cookie path 为 /）
# 放到 /etc/apache2/sites-available/kebiao.conf，证书先用 certbot certonly 签好，再 a2ensite kebiao。
# 主机名换成你的域名；PUBLIC_BASE_URL 设成 https://kebiao.example.com（无路径前缀）。
<VirtualHost *:80>
    ServerName kebiao.example.com
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=308]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName kebiao.example.com
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests"
    LimitRequestBody 1048576
    <LocationMatch "^/(widget|mobile)/[^/]+/upload$">
        LimitRequestBody 4194304
    </LocationMatch>
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"
    # retry=0：后端偶尔连不上时不要“拉黑” 60 秒（Apache 默认），下一个请求就重试
    ProxyPass        / unix:/run/kebiao/kebiao.sock|http://localhost/ timeout=90 retry=0
    ProxyPassReverse / unix:/run/kebiao/kebiao.sock|http://localhost/
    ErrorLog ${APACHE_LOG_DIR}/kebiao-error.log
    ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P:tid %T] %7F: %E: [client\ %a] %M"
    # 安全提示：/ics/<token>.ics、/widget/<token>.*、/mobile/<token>.json 里的 token 就是凭证，访问日志不记这些路径
    SetEnvIf Request_URI "^/(ics|widget|mobile)/" kebiao_token_path
    CustomLog ${APACHE_LOG_DIR}/kebiao-access.log combined env=!kebiao_token_path

    SSLCertificateFile /etc/letsencrypt/live/kebiao.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/kebiao.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
